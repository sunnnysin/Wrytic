name: Wrytic
options:
  bundleIdPrefix: com.wrytic
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  Wrytic:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Wrytic
    info:
      path: Generated/Wrytic-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrytic.app
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "27.0"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  WryticTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: WryticTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrytic.app.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Wrytic

schemes:
  Wrytic:
    build:
      targets:
        Wrytic: all
        WryticTests: [test]
    test:
      config: Debug
      targets:
        - WryticTests
    run:
      config: Debug
    archive:
      config: Release
